# Nginx configuration for Dendrite Matrix Server
# Add to your existing nginx configuration

# Matrix well-known for server discovery
server {
    listen 443 ssl http2;
    server_name ctrlaltdef.eu;

    # Your existing SSL config...

    # Matrix well-known endpoints
    location /.well-known/matrix/server {
        return 200 '{"m.server": "matrix.ctrlaltdef.eu:443"}';
        add_header Content-Type application/json;
    }

    location /.well-known/matrix/client {
        return 200 '{"m.homeserver": {"base_url": "https://matrix.ctrlaltdef.eu"}}';
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
    }
}

# Dendrite Matrix Server
server {
    listen 443 ssl http2;
    server_name matrix.ctrlaltdef.eu;

    ssl_certificate /etc/letsencrypt/live/matrix.ctrlaltdef.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.ctrlaltdef.eu/privkey.pem;

    # Client-Server API
    location ~* ^(\/_matrix|\/_synapse\/client) {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 50M;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Federation API (optional - only if you want federation)
    location /_matrix/federation {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8008/_dendrite/monitor/health;
    }
}

# Element Web Client
server {
    listen 443 ssl http2;
    server_name element.ctrlaltdef.eu;

    ssl_certificate /etc/letsencrypt/live/element.ctrlaltdef.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/element.ctrlaltdef.eu/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8009;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
