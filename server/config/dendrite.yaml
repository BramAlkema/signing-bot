# Dendrite Configuration - Minimal Setup
# https://matrix-org.github.io/dendrite/

version: 2

global:
  server_name: ${SERVER_NAME:-matrix.localhost}
  private_key: /etc/dendrite/matrix_key.pem

  database:
    connection_string: file:/var/dendrite/dendrite.db
    max_open_conns: 90
    max_idle_conns: 5
    conn_max_lifetime: -1

  cache:
    max_size_estimated: 1gb
    max_age: 1h

  jetstream:
    storage_path: /var/dendrite/jetstream
    in_memory: false

  metrics:
    enabled: false

  dns_cache:
    enabled: true
    cache_size: 256
    cache_lifetime: 5m

client_api:
  registration_disabled: false
  registration_shared_secret: "${REGISTRATION_SECRET}"
  rate_limiting:
    enabled: true
    threshold: 20
    cooloff_ms: 500

federation_api:
  send_max_retries: 16
  disable_tls_validation: false
  prefer_direct_fetch: false

media_api:
  base_path: /var/dendrite/media
  max_file_size_bytes: 52428800  # 50MB
  dynamic_thumbnails: true

sync_api:
  real_ip_header: X-Real-IP
  search:
    enabled: true
    index_path: /var/dendrite/searchindex
    language: en

user_api:
  bcrypt_cost: 10
  auto_join_rooms: []

mscs:
  mscs: []

logging:
  - type: std
    level: info
